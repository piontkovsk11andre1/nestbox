include /etc/nginx/modules/*.conf;

worker_processes  1;
error_log /dev/stderr notice;
pid /run/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    nchan_shared_memory_size 16M;
    limit_conn_zone $binary_remote_addr zone=nestbox_events:1m;

    map $http_x_forwarded_proto $nestbox_public_scheme {
        ~*^https(?:,|$) https;
        ~*^http(?:,|$) http;
        default $scheme;
    }

    map $http_host $agent_host {
        ~^localhost(:\d+)?$ agent.localhost$1;
        ~^127\.0\.0\.1(:\d+)?$ agent.localhost$1;
        default agent.$http_host;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80 default_server;

        root /var/www/html;
        index index.php;
        error_page 404 /404.php;

        # Super-documents are trusted and may contain inline scripts and styles.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Nestbox is actively edited; pages and generated bundles must not
        # remain stale in the browser cache.
        add_header Cache-Control "no-store" always;

        location = /_nestbox/health {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_intercept_errors on;
            fastcgi_param SCRIPT_FILENAME /sources/php/index.php;
        }

        location = /_nestbox/events {
            if ($arg_topics !~ "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}(?::[A-Za-z0-9][A-Za-z0-9._/-]{0,63})*(?::\*)?(?:,[A-Za-z0-9][A-Za-z0-9._/-]{0,63}(?::[A-Za-z0-9][A-Za-z0-9._/-]{0,63})*(?::\*)?){0,15}$") {
                return 400;
            }

            limit_conn nestbox_events 6;
            nchan_subscriber;
            nchan_channel_group_accounting on;
            nchan_channel_group nestbox;
            nchan_channel_id $arg_topics;
            nchan_channel_id_split_delimiter ",";
            nchan_max_channel_id_length 128;
            nchan_subscriber_first_message newest;
            nchan_eventsource_ping_interval 20s;
        }

        location ^~ /_nestbox/ {
            return 404;
        }

        # Includes, templates, and other internal directories are never public.
        location ~ (?:^|/)__[^/]*(?:/|$) {
            return 404;
        }

        location ~ ^/[Aa]gent/?$ {
            return 302 $nestbox_public_scheme://$agent_host/;
        }

        # The .md suffix is always the generated super-document direction.
        location ~ \.md$ {
            try_files "" @php;
        }

        # The document root is always handled by PHP. This avoids treating the
        # page-tree directory itself as a static directory before index.php exists.
        location = / {
            try_files "" @php;
        }

        # Main location block
        location / {
            # Existing source directories are not public directory indexes. If
            # one matches, let the PHP router resolve it without a slash redirect.
            # Repeat the server 404 handler because this location's 418 handler
            # otherwise prevents error_page inheritance for the empty root.
            error_page 404 /404.php;
            error_page 418 = @php;
            if (-d $request_filename) {
                return 418;
            }
            try_files $uri @php;
        }

        # Never serve raw PHP files from nginx
        location ~ \.php$ {
            return 404;
        }

        # PHP-originated and static 404 responses render the protected
        # super-document while retaining the original HTTP status and URI.
        location = /404.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_intercept_errors off;
            fastcgi_param SCRIPT_FILENAME /sources/php/index.php;
            fastcgi_param REQUEST_URI /404;
            fastcgi_param NESTBOX_ORIGINAL_URI $request_uri;
        }

        # Named location for PHP handling
        location @php {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php-fpm:9000;
            fastcgi_intercept_errors on;
            error_page 404 /404.php;
            fastcgi_param SCRIPT_FILENAME /sources/php/index.php;
        }

        # Deny access to any file or directory that starts with a dot (.)
        location ~ /\. {
            deny all;
        }
    }

    # Internal-only publisher. Port 8080 is exposed to Compose services but is
    # never published on the host.
    server {
        listen 8080;
        server_name _;

        location = /_nestbox/publish {
            if ($request_method != POST) {
                return 405;
            }
            if ($arg_topics !~ "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}(?::[A-Za-z0-9][A-Za-z0-9._/-]{0,63})*(?:,[A-Za-z0-9][A-Za-z0-9._/-]{0,63}(?::[A-Za-z0-9][A-Za-z0-9._/-]{0,63})*(?::\*)?){0,15}$") {
                return 400;
            }

            client_max_body_size 64k;
            nchan_publisher;
            nchan_channel_group_accounting on;
            nchan_channel_group nestbox;
            nchan_channel_id $arg_topics;
            nchan_channel_id_split_delimiter ",";
            nchan_max_channel_id_length 128;
            nchan_message_buffer_length 100;
            nchan_message_timeout 5m;
            nchan_group_max_messages 10000;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name agent.localhost ~^agent\..+$;

        location / {
            resolver 127.0.0.11 ipv6=off valid=10s;
            set $opencode http://opencode:4096;

            proxy_pass $opencode;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
